apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apponcn2
  namespace: bhutan
spec:
  project: default
  source:
    repoURL: https://github.com/sangayp607/argo.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
